name: Publish Discord release update

on:
  release:
    types: [published]

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send release to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_UPDATES_WEBHOOK is not configured; skipping notification."
            exit 0
          fi

          plugin_id="${RELEASE_TAG%%-v*}"
          if [[ "$RELEASE_TAG" == *-v* && -n "$plugin_id" ]]; then
            changelog_url="https://sndevelopment.dev/plugins/${plugin_id}/changelog"
          else
            changelog_url="https://sndevelopment.dev/changelog"
          fi

          content=$(printf '🚀 **%s** is now available.\nChangelog: <%s>' \
            "$RELEASE_NAME" "$changelog_url")
          payload=$(jq -n --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}')

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$WEBHOOK_URL"
